services:
  init:
    image: alpine:3.19
    command: ["sh", "-c", "mkdir -p /app/output && echo ready"]
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 1

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./data/input:/app/data/input:ro
      - ./output:/app/output
    environment:
      - INPUT_DIR=/app/data/input
      - OUTPUT_DIR=/app/output
    healthcheck:
      test: ["CMD", "cat", "/app/output/.done"]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
