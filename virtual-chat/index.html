<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>バーチャルチャット</title>
    <link rel="icon" href="/etc/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-image"></div>
    <div class="bubble" id="bubble">
        <img src="etc/fukidashi.png">
        <div class="dots">
            <span class="dot">・</span>
            <span class="dot">・</span>
            <span class="dot">・</span>
        </div>
    </div>
    <div class="sumaho">
        <div class="line">
            <div class="line-header">
                <span>バーチャル</span>
                <div class="icon">
                    <button id="reading"><img src="etc/スピーカー.png"></button>
                    <button id="voiceRecognition"><img src="etc/電話.png"></button>
                </div>
            </div>
            <div class="line-log" id="lineLog"></div>
            <div class="line-input">
                <input type="text" id="message" autocomplete="off">
                <button id="send">▶</button>
            </div>
        </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
